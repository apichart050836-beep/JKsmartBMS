<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Primary Health</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-50 to-slate-100 p-4 font-sans antialiased sm:p-8">

  <div class="mx-auto max-w-2xl">

    <!-- ============================================================
         Main Card - Smart Home Dashboard style: white, airy, soft shadow
         ============================================================ -->
    <section class="rounded-2xl bg-white p-5 shadow-[0_20px_50px_-20px_rgba(15,23,42,0.15)] sm:p-7">

      <!-- Header -->
      <div class="mb-7 flex items-center justify-between">
        <h2 class="text-base font-bold tracking-tight text-slate-800">Primary Health</h2>
        <span class="text-[11px] font-light text-slate-400">Pack overview</span>
      </div>

      <!-- SOC / SOH rings -->
      <div class="flex flex-col items-center justify-center gap-10 sm:flex-row sm:gap-16">

        <!-- SOC - Smart Home Blue -->
        <div class="flex flex-col items-center">
          <div class="relative h-40 w-40 sm:h-44 sm:w-44">
            <svg viewBox="0 0 100 100" class="h-full w-full -rotate-90">
              <circle cx="50" cy="50" r="42" fill="none" stroke="#eef2f7" stroke-width="10" />
              <circle
                id="socRing"
                cx="50" cy="50" r="42" fill="none"
                stroke="#3b82f6" stroke-width="10" stroke-linecap="round"
                stroke-dasharray="263.9" stroke-dashoffset="263.9"
                style="transition: stroke-dashoffset 0.9s ease"
              />
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
              <span id="socValue" class="text-3xl font-semibold text-slate-800">0%</span>
            </div>
          </div>
          <h3 class="mt-3 text-xs font-semibold text-slate-700">State of Charge</h3>
          <p id="socSub" class="text-[11px] text-slate-400">0.0 Ah remaining</p>
        </div>

        <!-- SOH - Mint Green -->
        <div class="flex flex-col items-center">
          <div class="relative h-40 w-40 sm:h-44 sm:w-44">
            <svg viewBox="0 0 100 100" class="h-full w-full -rotate-90">
              <circle cx="50" cy="50" r="42" fill="none" stroke="#eef2f7" stroke-width="10" />
              <circle
                id="sohRing"
                cx="50" cy="50" r="42" fill="none"
                stroke="#34d399" stroke-width="10" stroke-linecap="round"
                stroke-dasharray="263.9" stroke-dashoffset="0"
                style="transition: stroke-dashoffset 0.9s ease"
              />
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
              <span id="sohValue" class="text-3xl font-semibold text-slate-800">100%</span>
            </div>
          </div>
          <h3 class="mt-3 text-xs font-semibold text-slate-700">State of Health</h3>
          <p class="text-[11px] text-slate-400">vs. rated capacity</p>
        </div>

      </div>

      <!-- ============================================================
           Energy Today panel - light slate, NOT dark, per latest spec
           ============================================================ -->
      <div class="mt-8 rounded-2xl border border-slate-200 bg-slate-50 p-4 sm:p-5">

        <div class="mb-3 flex items-center justify-between px-1">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Energy Today</span>
          <span id="nominalVoltLabel" class="text-[11px] text-slate-400">51.2V nominal</span>
        </div>

        <div class="flex flex-col gap-3 sm:flex-row">

          <!-- CHARGED -->
          <div class="flex flex-1 flex-col gap-1.5 rounded-xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
            <div class="flex items-center gap-2">
              <span class="flex h-7 w-7 items-center justify-center rounded-full bg-emerald-100 text-emerald-600">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="8" x2="12" y2="16"></line>
                  <polyline points="8 12 12 16 16 12"></polyline>
                </svg>
              </span>
              <span class="text-[11px] font-medium uppercase tracking-wide text-slate-500">Charged</span>
            </div>
            <span id="chargedAh" class="text-2xl font-semibold tabular-nums text-emerald-500">0.00 Ah</span>
            <span id="chargedKwh" class="text-[11px] font-medium text-slate-400">0.000 kWh</span>
          </div>

          <!-- USED -->
          <div class="flex flex-1 flex-col gap-1.5 rounded-xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
            <div class="flex items-center gap-2">
              <span class="flex h-7 w-7 items-center justify-center rounded-full bg-orange-100 text-orange-600">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="16" x2="12" y2="8"></line>
                  <polyline points="16 12 12 8 8 12"></polyline>
                </svg>
              </span>
              <span class="text-[11px] font-medium uppercase tracking-wide text-slate-500">Used</span>
            </div>
            <span id="usedAh" class="text-2xl font-semibold tabular-nums text-orange-500">0.00 Ah</span>
            <span id="usedKwh" class="text-[11px] font-medium text-slate-400">0.000 kWh</span>
          </div>

        </div>
      </div>

    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLbUwX40SfeQMAooCzFYKAXgyvo_Io8B4",
      authDomain: "jkbms-32dfe.firebaseapp.com",
      databaseURL: "https://jkbms-32dfe-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "jkbms-32dfe",
      storageBucket: "jkbms-32dfe.firebasestorage.app",
      messagingSenderId: "593623244773",
      appId: "1:593623244773:web:1b3f6a91609bad6b76590c",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const statusRef = ref(db, "JK_BMS_HUB/e072a1d6dd18/status");

    // Forced to 51.2V (16S convention) per explicit instruction - this real
    // pack is actually 4S (~12.8V), so dailyChargeKwh/dailyDischargeKwh
    // pushed by the firmware (which uses the real 12.8V) will read ~4x
    // lower than what this widget computes locally from Ah. Recomputing
    // client-side here rather than trusting the firmware's kWh fields, so
    // this constant is the one true source of the (deliberately wrong,
    // as instructed) conversion.
    const NOMINAL_VOLTAGE = 51.2;
    const RING_CIRCUMFERENCE = 2 * Math.PI * 42; // r=42, matches both <circle> elements

    const socRing = document.getElementById("socRing");
    const socValue = document.getElementById("socValue");
    const socSub = document.getElementById("socSub");
    const sohRing = document.getElementById("sohRing");
    const sohValue = document.getElementById("sohValue");
    const chargedAhEl = document.getElementById("chargedAh");
    const chargedKwhEl = document.getElementById("chargedKwh");
    const usedAhEl = document.getElementById("usedAh");
    const usedKwhEl = document.getElementById("usedKwh");

    function setRingProgress(circleEl, pct) {
      const clamped = Math.max(0, Math.min(100, pct));
      circleEl.setAttribute("stroke-dashoffset", String(RING_CIRCUMFERENCE * (1 - clamped / 100)));
    }

    function ahToKwh(ah) {
      return (ah * NOMINAL_VOLTAGE) / 1000;
    }

    // The bridge firmware has used more than one field-naming scheme
    // (percent_remain -> soc, etc). Read whichever is actually live so this
    // widget doesn't show 0/blank just because the ESP32 hasn't been
    // reflashed with the latest jkbms-bridge.yaml yet.
    function pick(obj, ...keys) {
      for (const k of keys) {
        if (obj[k] !== undefined) return obj[k];
      }
      return undefined;
    }

    onValue(statusRef, (snapshot) => {
      const status = snapshot.val();
      if (!status) return;

      const soc = pick(status, "soc", "percent_remain") ?? 0;
      const remainAh = status.capacity_remain ?? 0;
      const soh = status.primaryHealth ?? 100;

      socValue.textContent = `${Math.round(soc)}%`;
      socSub.textContent = `${remainAh.toFixed(1)} Ah remaining`;
      setRingProgress(socRing, soc);

      sohValue.textContent = `${Math.round(soh)}%`;
      setRingProgress(sohRing, soh);

      const chargedAh = status.dailyChargeAh ?? 0;
      const dischargedAh = status.dailyDischargeAh ?? 0;
      chargedAhEl.textContent = `${chargedAh.toFixed(2)} Ah`;
      chargedKwhEl.textContent = `${ahToKwh(chargedAh).toFixed(3)} kWh`;
      usedAhEl.textContent = `${dischargedAh.toFixed(2)} Ah`;
      usedKwhEl.textContent = `${ahToKwh(dischargedAh).toFixed(3)} kWh`;
    });
  </script>

</body>
</html>
